<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">rs70archive preview</title>
  <desc id="desc">Warm textured background with rs70archive title</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ea"/>
      <stop offset="1" stop-color="#e9dcc5"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="10%" r="60%">
      <stop offset="0" stop-color="#fffdf7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f6f2e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g opacity="0.12" fill="#c66a3d">
    <circle cx="1080" cy="120" r="80"/>
    <circle cx="1040" cy="520" r="140"/>
  </g>
  <rect x="90" y="90" width="1020" height="450" rx="48" fill="#fff9ef" stroke="#c66a3d" stroke-width="10"/>
  <text x="150" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#2a2118" letter-spacing="4">rs70archive</text>
  <text x="150" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="50" fill="#3b2e22" opacity="0.8">Static asset catalog served via jsDelivr</text>
  <text x="150" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#2a2118" opacity="0.7">Developed by Sabbir Bin Abbas</text>
